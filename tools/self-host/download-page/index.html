<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#236b57">
  <title>题库 · 选择下载版本</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f7f5;
      --surface: #fff;
      --text: #20302c;
      --muted: #687a74;
      --line: #d7e5df;
      --accent: #236b57;
      --accent-soft: #e7f1ed;
      --shadow: 0 18px 50px rgb(32 48 44 / 8%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171c1b;
        --surface: #202725;
        --text: #edf4f1;
        --muted: #aab9b3;
        --line: #3a4944;
        --accent: #98d4bd;
        --accent-soft: #293c35;
        --shadow: 0 18px 50px rgb(0 0 0 / 22%);
      }
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(ellipse at top, var(--accent-soft), transparent 55%), var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 880px); }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 48px); line-height: 1.12; letter-spacing: -.035em; }
    .intro { max-width: 580px; margin: 14px 0 24px; color: var(--muted); font-size: 17px; }
    .status { min-height: 26px; margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .card {
      position: relative;
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color .18s ease, transform .18s ease;
    }
    .card.recommended { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow); }
    .card:hover { transform: translateY(-2px); }
    .card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .icon { display: grid; width: 48px; height: 48px; flex: 0 0 48px; place-items: center; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-size: 25px; font-weight: 750; }
    h2 { margin: 0; font-size: 21px; }
    .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .actions { display: grid; gap: 10px; }
    a.button {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: background .15s ease, border-color .15s ease;
    }
    a.button:hover { border-color: var(--accent); background: var(--accent-soft); }
    a.button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) { a.button.primary { color: #14221d; } }
    a.button[aria-disabled="true"] { opacity: .48; pointer-events: none; }
    .detail { margin: 13px 0 0; color: var(--muted); font-size: 12px; }
    .footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 20px; color: var(--muted); font-size: 13px; }
    .footer a { color: var(--accent); text-underline-offset: 3px; }
    .error { color: #a43d3d; }
    @media (max-width: 620px) {
      body { place-items: start center; padding: 36px 16px 24px; }
      .cards { grid-template-columns: 1fr; }
      .card { padding: 20px; }
      .intro { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Question Bank</p>
    <h1>下载题库桌面版</h1>
    <p class="intro">页面会识别你的电脑并推荐对应版本。也可以手动选择其他平台。</p>
    <p class="status" id="status" role="status" aria-live="polite">正在获取最新版本…</p>

    <section class="cards" aria-label="选择操作系统">
      <article class="card" id="mac-card">
        <div class="card-head">
          <span class="icon" aria-hidden="true">⌘</span>
          <div><h2>macOS</h2><p class="subtitle">Apple 芯片 · DMG 安装包</p></div>
        </div>
        <div class="actions">
          <a class="button primary download" id="mac-download" href="#" aria-disabled="true">下载 macOS 版</a>
        </div>
        <p class="detail">适用于 Apple Silicon（M 系列）Mac。</p>
      </article>

      <article class="card" id="windows-card">
        <div class="card-head">
          <span class="icon" aria-hidden="true">⊞</span>
          <div><h2>Windows</h2><p class="subtitle">Windows 10 / 11 · x64</p></div>
        </div>
        <div class="actions">
          <a class="button primary download" id="windows-setup" href="#" aria-disabled="true">下载安装版</a>
          <a class="button download" id="windows-portable" href="#" aria-disabled="true">下载便携版</a>
        </div>
        <p class="detail">安装版支持自动更新；便携版无需安装，下载后直接运行。</p>
      </article>
    </section>

    <footer class="footer">
      <span id="release-version">题库桌面版</span>
      <a href="https://github.com/qingye0312-cpu/question-bank/releases/latest" target="_blank" rel="noreferrer">在 GitHub 查看所有版本</a>
    </footer>
  </main>
  <script>
    const statusNode = document.querySelector('#status');
    const versionNode = document.querySelector('#release-version');
    const cards = {
      mac: document.querySelector('#mac-card'),
      windows: document.querySelector('#windows-card'),
    };
    const platform = String(navigator.userAgentData?.platform || navigator.platform || navigator.userAgent || '').toLowerCase();
    const detected = platform.includes('win') ? 'windows' : platform.includes('mac') ? 'mac' : '';
    if (detected) cards[detected].classList.add('recommended');

    const setDownload = (id, url) => {
      const link = document.querySelector(`#${id}`);
      link.href = url;
      link.removeAttribute('aria-disabled');
      link.setAttribute('download', '');
    };

    async function loadRelease() {
      try {
        const response = await fetch('/v1/desktop/latest.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const manifest = await response.json();
        const version = String(manifest.version || '');
        if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('版本清单格式无效');
        const root = `/v1/desktop/releases`;
        const macName = `题库_${version}_macOS_arm64.dmg`;
        setDownload('mac-download', `${root}/macos/${version}/${encodeURIComponent(macName)}`);
        setDownload('windows-setup', `${root}/windows/${version}/题库_windows_x64_setup.exe`);
        setDownload('windows-portable', `${root}/windows/${version}/题库_windows_x64_portable.exe`);
        versionNode.textContent = `当前版本 v${version}`;
        statusNode.textContent = detected
          ? `已识别为 ${detected === 'mac' ? 'macOS' : 'Windows'}，已为你标出推荐版本。`
          : '未能自动识别操作系统，请手动选择。';
      } catch (error) {
        statusNode.textContent = '暂时无法获取最新版本，请稍后重试或从 GitHub 版本页下载。';
        statusNode.classList.add('error');
        versionNode.textContent = error instanceof Error ? `版本信息暂不可用（${error.message}）` : '版本信息暂不可用';
      }
    }
    void loadRelease();
  </script>
</body>
</html>
