[package]
name = "question-bank"
version = "0.2.17"
edition = "2021"
default-run = "question-bank"

[lib]
name = "question_bank"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1"
rust_xlsxwriter = "0.90"
tempfile = "3"
base64 = "0.22"
regex = "1"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3.6"
windows = { version = "0.62", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Security_Credentials", "Win32_System_WinRT", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[profile.release]
strip = true
lto = "thin"
