<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const example={format:'qbank-photo-question-1',type:'single',stem:'以下哪项操作会直接保存到本地，而不自动向云端提交？',options:[{key:'A',content:'编辑录题草稿'},{key:'B',content:'点击上传按钮'},{key:'C',content:'确认合并并发布'},{key:'D',content:'将本地题库设为云端题库'}],answer:['A'],answer_origin:'inferred',explanation:'编辑内容自动保存在本地。只有录题结束后主动点击上传，才会提交待上传新题。',model:{name:'示例模型',version:'演示',version_source:'user'},warnings:[]};
const second={...clone(example),type:'true_false',stem:'小程序可以把一个本地题库设为自动同步云端题库。',options:[],answer:false,explanation:'这个入口仅在桌面端提供，且需要应用内最高权限。'};
const third={...clone(example),stem:'以下哪些信息应在题目编辑后继续保留？',type:'multiple',options:[{key:'A',content:'题目稳定 ID'},{key:'B',content:'首次录入时间'},{key:'C',content:'把首次录入时间改成上传时间'}],answer:['A','B'],explanation:'首次录入时间和题目身份保持稳定，修改另记更新时间。'};
let counter=3, records=[example,second,third].map((q,i)=>({id:'demo-'+(i+1),q:clone(q),time:'2026-10-18 10:'+String(36+i),state:'pending',raw:JSON.stringify(q,null,2),parseError:''}));
let current=records[0].id, draft=clone(example), raw=records[0].raw, activeTab='editor', device='desktop', role='developer', logged=true, tasks=[], rawDirty=false, parseTimer, saveTimer, toastTimer, removed, promotion=false, promoted=false, promotionStep=0;
function record(){return records.find(r=>r.id===current)}
function invalid(q){if(!q||!q.stem.trim())return '请补全题干';if(q.type==='true_false')return typeof q.answer==='boolean'?'':'请选择正确或错误';if(q.options.length<2||q.options.length>8)return '选择题需要 2～8 个选项，已保留全部识别内容';if(q.options.some(o=>!o.content.trim()))return '请补全选项内容';if(!Array.isArray(q.answer)||q.answer.some(k=>!q.options.some(o=>o.key===k))||(q.type==='single'?q.answer.length!==1:q.answer.length<2))return '请核对正确答案';return ''}
function status(r){return r.parseError||invalid(r.q)?'incomplete':r.state}
function pending(){return records.filter(r=>r.state==='pending')}
function answer(q){return q.type==='true_false'?(typeof q.answer==='boolean'?(q.answer?'正确':'错误'):'未选择'):Array.isArray(q.answer)&&q.answer.length?q.answer.join('、'):'未选择'}
function label(q){return {single:'单选',multiple:'多选',true_false:'判断'}[q.type]||'未知'}
function toast(message,undo=false){clearTimeout(toastTimer);$('#toast').innerHTML=esc(message)+(undo?'<button id="undo">撤销</button>':'');$('#toast').classList.remove('hidden');if(undo)$('#undo').onclick=()=>{records.push(removed);removed=null;render();toast('已恢复，录入时间与题目 ID 保持不变')};toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
function autoSave(){if(record()?.state==='sending'||record()?.state==='uploaded')return;clearTimeout(saveTimer);if(!current){current='demo-'+(++counter);records.push({id:current,q:clone(draft),time:'2026-10-18 '+new Date().toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'}),state:'pending',raw,parseError:''})}const r=record();r.q=clone(draft);r.raw=raw;$('#saveStatus').textContent='正在自动保存…';updateChrome();saveTimer=setTimeout(()=>{$('#saveStatus').textContent='已自动保存到本地 · 演示';updateChrome()},400)}
function flush(){clearTimeout(saveTimer);clearTimeout(parseTimer);if(rawDirty)parseSource(raw,false);if(record()&&record().state==='pending'){record().q=clone(draft);record().raw=raw}$('#saveStatus').textContent='已自动保存到本地 · 演示'}
function updateChrome(){const editable=pending(), total=records.filter(r=>r.state!=='uploaded').length;$('#recordCount').textContent=total;$('#taskCount').textContent=tasks.length;$('#upload').textContent='上传 '+editable.length+' 题 ↑';$('#upload').disabled=!editable.length;$('#upload').classList.toggle('hidden',activeTab==='library');$('#next').classList.toggle('hidden',activeTab==='library');$('#footerHint').textContent=activeTab==='library'?'云库转换仅限桌面最高权限':'录题期间不会自动上传';$('#appTitle').textContent=activeTab==='library'?'题库管理':'新题录入';$('#auth').textContent=logged?'开':'访';$('#auth').title=logged?'演示：开发者已登录；点击切换':'演示：访客；点击切换';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab))}
function setTab(tab){flush();activeTab=tab;render();$('#stage').scrollTop=0}
function render(){updateChrome();$('#stage').innerHTML=activeTab==='editor'?editorHTML():activeTab==='records'?recordsHTML():activeTab==='uploads'?uploadsHTML():libraryHTML();wire();resizeInputs()}
function mobileActions(){return '<div class="mobile-actions"><select aria-label="当前题库"><option>软件基础 · 示例题库</option></select><button data-action="copy">复制提示词</button><button class="primary" data-action="paste">粘贴题目</button></div>'}
function editorHTML(){const r=record(), locked=r&&r.state!=='pending', error=r?.parseError||'', issue=invalid(draft);return `<div class="editor-layout"><aside class="source-pane"><p class="eyebrow">SOURCE</p><h2 class="section-title">原始内容</h2><p class="pane-description">粘贴模型回复，右侧自动识别为可编辑题目。</p><div class="source-actions"><button data-action="copy">复制提示词</button><button data-action="paste">粘贴题目</button></div><label><span class="hidden">模型原文</span><textarea id="raw" spellcheck="false" ${locked?'disabled':''}>${esc(raw)}</textarea></label><div class="source-meta"><span>${error?'原文需修正':'JSON · 单题识别'}</span><button class="quiet small" data-action="sample">载入示例</button></div><div class="source-foot"><p>右侧的题干、选项、答案和解析均可修改。输入会自动保存到本地。</p><p>本次全部录完后，再点击底部上传。</p><button class="quiet" data-action="blank">＋ 手工录题</button></div></aside><section class="editor-pane">${mobileActions()}<div class="editor-top"><b>题目核对</b><span class="badge ${issue||error?'amber':locked?'gray':''}">${locked?(r.state==='uploaded'?'已上传 · 待合并':'等待回执'):issue||error?'待补全':'待上传'}</span></div>${error?`<div class="notice" role="alert">${esc(error)}。原文已保留，请修正后再上传。</div>`:''}${locked?'<div class="read-only-note">此题已确认提交，快照保持不变。可以继续录下一题。</div>':''}<fieldset style="border:0;padding:0;margin:0;min-width:0" ${locked?'disabled':''}><div class="type-group" aria-label="题型">${['single','multiple','true_false'].map(t=>`<button data-type="${t}" class="${draft.type===t?'active':''}" aria-pressed="${draft.type===t}">${label({type:t})}</button>`).join('')}</div><div class="field"><div class="field-head"><span>题干</span><small>可直接修改</small></div><label><span class="hidden">题干</span><textarea id="stem" class="stem" placeholder="输入或粘贴一道题的题干">${esc(draft.stem)}</textarea></label></div><div class="field"><div class="field-head"><span>${draft.type==='true_false'?'正确答案':'选项与答案'}</span><small>点击圆点选中，再次点击取消</small></div>${draft.type==='true_false'?`<div class="judgment">${[true,false].map(v=>`<button data-bool="${v}" class="${draft.answer===v?'selected':''}" aria-pressed="${draft.answer===v}">${draft.answer===v?'●':'○'}　${v?'正确':'错误'}</button>`).join('')}</div>`:`<div class="options">${draft.options.map((o,i)=>`<div class="option ${Array.isArray(draft.answer)&&draft.answer.includes(o.key)?'selected':''}"><button class="dot" data-answer="${o.key}" aria-label="${o.key} 正确答案" aria-pressed="${Array.isArray(draft.answer)&&draft.answer.includes(o.key)}">${Array.isArray(draft.answer)&&draft.answer.includes(o.key)?'●':'○'}</button><span class="option-key">${esc(o.key)}</span><label><span class="hidden">选项 ${esc(o.key)}</span><textarea data-option="${i}" rows="1">${esc(o.content)}</textarea></label><details class="option-menu"><summary aria-label="选项 ${esc(o.key)} 操作">⋯</summary><div><button data-move="${i}" data-dir="-1" ${i===0?'disabled':''}>上移</button><button data-move="${i}" data-dir="1" ${i===draft.options.length-1?'disabled':''}>下移</button><button data-remove="${i}" ${draft.options.length<=2?'disabled':''}>删除选项</button></div></details></div>`).join('')}</div><div class="answer-caption">当前答案：<span id="answerText">${esc(answer(draft))}</span></div><button class="add-option" data-action="add" ${draft.options.length>=8?'disabled':''}>＋ 添加选项</button>`}${issue?`<div class="error" id="validation" role="alert">${esc(issue)}</div>`:'<div class="error" id="validation"></div>'}</div><div class="field"><div class="field-head"><span>解析</span><small>选填</small></div><label><span class="hidden">解析</span><textarea id="explanation" class="explanation" placeholder="补充正确答案的理由">${esc(draft.explanation)}</textarea></label></div><details class="more-fields"><summary>更多信息　<span class="muted">模型来源、章节、标签等</span></summary><div class="meta-grid"><label>模型名称<input data-meta="name" value="${esc(draft.model.name)}"></label><label>模型版本<input data-meta="version" value="${esc(draft.model.version)}"></label><label>章节<input data-extra="chapter" value="${esc(draft.chapter||'')}" placeholder="未填写"></label><label>标签<input data-extra="tagsText" value="${esc(draft.tagsText||'')}" placeholder="用逗号分隔"></label><label>难度<select data-extra="difficulty"><option value="">未设置</option><option>简单</option><option>中等</option><option>困难</option></select></label><label>适用版本<input data-extra="applicable_version" value="${esc(draft.applicable_version||'')}" placeholder="未填写"></label><label>外部编号<input data-extra="external_id" value="${esc(draft.external_id||'')}" placeholder="未填写"></label><label>来源说明<input data-extra="sourceNote" value="${esc(draft.sourceNote||'')}" placeholder="原始作答来源"></label><label class="full">需核实的说明<textarea data-extra="warningText" rows="2">${esc(draft.warningText||draft.warnings.join('\n'))}</textarea></label></div></details></fieldset><div class="time-line">录入时间：${r?esc(r.time):'首次自动保存时记录'}　·　修改不改变首次录入时间</div></section></div>`}
function recordsHTML(){return `<div class="page-content"><div class="page-top"><div><h2>录题记录</h2><p>逐题自动存本地，未上传记录继续保留。</p></div><input class="list-search" id="search" aria-label="搜索录题记录" placeholder="搜索题干…"></div><div id="rows">${recordRows(records)}</div><p class="records-help">本次结束时点击“上传”。尚未补全的题目会先定位提示，不会静默跳过。</p></div>`}
function recordRows(rows){return rows.length?rows.map((r,i)=>{const s=status(r), title={pending:'待上传',incomplete:'待补全',sending:'上传中',uploaded:'已上传 · 待合并'}[s];return `<article class="record-row"><span class="row-no">${String(i+1).padStart(2,'0')}</span><div><div class="record-name">${esc(r.q.stem||'尚未填写题干')}</div><div class="record-meta">${label(r.q)} · 答案 ${esc(answer(r.q))} · ${esc(r.time)}</div></div><span class="badge ${s==='incomplete'?'amber':s==='uploaded'?'gray':''}">${title}</span><div class="row-actions"><button class="quiet small" data-edit="${r.id}">${r.state==='pending'?'编辑':'查看'}</button>${r.state==='pending'?`<button class="quiet small" data-delete="${r.id}">移除</button>`:''}</div></article>`}).join(''):'<div class="empty">还没有录题记录。粘贴一道题试试。</div>'}
function uploadsHTML(){return `<div class="page-content"><div class="page-top"><div><h2>上传记录</h2><p>本次全部待上传题统一压缩编码，一个提交和回执。继续录题不会加入已确认的包。</p></div><button class="small" data-action="back">继续录题 →</button></div>${tasks.length?tasks.map((t,i)=>`<article class="task-card"><div class="task-head"><h3>${esc(t.title)}</h3><span class="badge ${t.done?'':'amber'}">${t.done?'已上传 · 待合并':'正在上传'}</span></div><p>提交 ${String(i+1).padStart(2,'0')} · ${t.count} 题 · ${t.done?'回执已保存':'内容已锁定，等待回执'}</p><div class="progress"><span style="width:${t.done?100:45}%"></span></div></article>`).join(''):'<div class="empty">尚未点击上传。自动保存不会发起上传。</div>'}<p class="records-help">此处为流程演示，实际实现须在服务端回执验证并落盘后才显示成功。</p></div>`}
function libraryHTML(){return `<div class="page-content"><div class="page-top"><div><h2>我的题库</h2><p>将已有本地题库设为云端题库后，自动上传首版并启用同步。</p></div></div><div class="role-demo"><span>审核演示身份</span><select id="role"><option value="developer" ${role==='developer'?'selected':''}>普通开发者</option><option value="admin" ${role==='admin'?'selected':''}>最高权限账号</option></select><span>实际身份由服务端验证</span></div><article class="bank-card"><div class="bank-info"><div class="bank-icon">▤</div><div><h3>计算机基础 · 本地题库</h3><p>12 题 · 本地可编辑 · 示例数据</p></div></div><div>${promoted?'<span class="badge">自动同步云端题库</span>':role==='admin'?'<button class="primary" data-action="promote">设为云端题库</button>':'<span class="badge gray">本地题库</span>'}</div></article><p class="bank-detail">普通开发者与合并维护者没有创建云库权限。小程序始终不提供此入口。</p>${promotion?`<section class="promotion"><h3>${promoted?'已启用云端同步':'启用云端题库'}</h3><p>计算机基础 · 12 题。首版发布后，可被其他用户下载与自动同步。</p><div class="steps">${['校验最高权限与本地快照','注册并上传首版内容','验证首版并激活目录','完成本地转换与同步'].map((s,i)=>`<div class="step ${promotionStep>i?'complete':''}">${promotionStep>i?'✓':i+1}　${s}</div>`).join('')}</div>${promoted?'<p>初始化结果：20261018-103800000+0800_计算机基础_正式_v1_示例</p>':`<div class="promotion-action"><button data-action="cancelPromotion" ${promotionStep?'disabled':''}>取消</button><button class="primary" data-action="confirmPromotion" ${promotionStep?'disabled':''}>${promotionStep?'正在自动完成…':'确认设为云端题库'}</button></div>`}</section>`:''}</div>`}
function resizeInputs(){document.querySelectorAll('.option textarea').forEach(t=>{t.style.height='auto';t.style.height=Math.max(28,t.scrollHeight)+'px'})}
function normalizeOptions(order){const old=draft.options, selected=new Set(Array.isArray(draft.answer)?draft.answer:[]);draft.options=order.map((n,i)=>({key:String.fromCharCode(65+i),content:old[n].content}));draft.answer=order.flatMap((n,i)=>selected.has(old[n].key)?[String.fromCharCode(65+i)]:[])}
function editChanged(){autoSave();$('#validation').textContent=invalid(draft);resizeInputs()}
function openRecord(id){flush();current=id;draft=clone(record().q);raw=record().raw;activeTab='editor';render();$('#stage').scrollTop=0}
function newQuestion(){flush();current=null;draft={...clone(example),stem:'',options:[{key:'A',content:''},{key:'B',content:''}],answer:[],explanation:''};raw='';activeTab='editor';render();$('#stage').scrollTop=0;$('#stem')?.focus()}
function parseSource(text,renderNow=true){rawDirty=false;raw=text;try{const v=JSON.parse(text.trim().replace(/^```(?:json)?\s*\n([\s\S]*?)\n```\s*$/i,'$1'));if(!v||Array.isArray(v)||!['single','multiple','true_false'].includes(v.type))throw Error('题型尚未识别');if(!Array.isArray(v.options)||v.options.some(o=>!o||typeof o.content!=='string'))throw Error('选项格式尚不完整');draft={...clone(example),...v,stem:typeof v.stem==='string'?v.stem:'',explanation:typeof v.explanation==='string'?v.explanation:'',model:v.model||clone(example.model),warnings:Array.isArray(v.warnings)?v.warnings:[]};if(record())record().parseError='';autoSave()}catch(e){if(!record()){autoSave()}record().parseError='原文尚不是可识别的完整 JSON';record().raw=raw;autoSave()}if(renderNow)render()}
async function paste(){if(record()?.state!=='pending'&&record()){newQuestion()}try{const text=await navigator.clipboard.readText();if(!text.trim())throw Error('empty');parseSource(text);toast('已从剪贴板识别，正在模拟本地自动保存')}catch{toast('浏览器无法读取剪贴板。可点“载入示例”，或在桌面原文区输入。')}}
async function upload(){flush();const rows=pending();if(!rows.length)return;const bad=rows.find(r=>r.parseError||invalid(r.q));if(bad){openRecord(bad.id);toast('先补全这道题，或在录题记录中移除');return}if(!logged){logged=true;updateChrome();toast('演示：已完成按需开发者认证，请再次点击上传');return}const ids=rows.map(r=>r.id);for(const r of rows)r.state='sending';const task={id:crypto.randomUUID(),title:'本次录题统一提交',count:ids.length,done:false};tasks.push(task);activeTab='uploads';render();toast('演示：'+ids.length+' 题统一压缩编码为一个包，可以继续录题');await new Promise(r=>setTimeout(r,650));task.done=true;for(const id of ids)records.find(r=>r.id===id).state='uploaded';if(activeTab==='uploads'||activeTab==='records')render();else updateChrome();toast('演示：整包回执已保存，共 '+ids.length+' 题')}
async function promote(){if(device!=='desktop'||role!=='admin')return;for(let i=1;i<=4;i++){promotionStep=i;render();await new Promise(r=>setTimeout(r,650))}promoted=true;render();toast('演示完成：已自动上传首版并启用同步')}
function wire(){
 const rawInput=$('#raw');if(rawInput)rawInput.oninput=e=>{raw=e.target.value;rawDirty=true;if(record()){record().raw=raw;record().parseError='原文正在识别';}clearTimeout(parseTimer);$('#saveStatus').textContent='识别中…';parseTimer=setTimeout(()=>parseSource(raw),350)};
 if($('#stem'))$('#stem').oninput=e=>{draft.stem=e.target.value;editChanged()};if($('#explanation'))$('#explanation').oninput=e=>{draft.explanation=e.target.value;editChanged()};
 document.querySelectorAll('[data-option]').forEach(t=>t.oninput=e=>{draft.options[Number(t.dataset.option)].content=e.target.value;editChanged()});
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const key=b.dataset.answer, selected=Array.isArray(draft.answer)?draft.answer:[];draft.answer=selected.includes(key)?selected.filter(k=>k!==key):draft.type==='single'?[key]:[...selected,key];autoSave();render()});
 document.querySelectorAll('[data-bool]').forEach(b=>b.onclick=()=>{const value=b.dataset.bool==='true';draft.answer=draft.answer===value?null:value;autoSave();render()});
 document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{if(draft.type===b.dataset.type)return;draft.type=b.dataset.type;draft.answer=[];if(draft.type==='true_false')draft.options=[];else if(!draft.options.length)draft.options=[{key:'A',content:''},{key:'B',content:''}];autoSave();render()});
 document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const from=Number(b.dataset.move),to=from+Number(b.dataset.dir),order=draft.options.map((_,i)=>i);[order[from],order[to]]=[order[to],order[from]];normalizeOptions(order);autoSave();render()});
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{normalizeOptions(draft.options.map((_,i)=>i).filter(i=>i!==Number(b.dataset.remove)));autoSave();render()});
 document.querySelectorAll('[data-meta]').forEach(t=>t.oninput=()=>{draft.model[t.dataset.meta]=t.value;autoSave()});
 document.querySelectorAll('[data-extra]').forEach(t=>t.oninput=()=>{draft[t.dataset.extra]=t.value;autoSave()});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecord(b.dataset.edit));
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{flush();removed=records.find(r=>r.id===b.dataset.delete);records=records.filter(r=>r!==removed);if(current===removed.id)current=null;render();toast('已移出录题记录',true)});
 if($('#search'))$('#search').oninput=e=>{const value=e.target.value.toLowerCase();document.querySelectorAll('.record-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(value))};
 if($('#role'))$('#role').onchange=e=>{role=e.target.value;promotion=false;render()};
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{switch(b.dataset.action){case 'copy':try{await navigator.clipboard.writeText('请按 qbank-photo-question-1 输出一题 JSON，含题型、题干、选项、答案、解析和真实模型来源。此处是审核原型的简化演示提示词。');toast('演示提示词已复制')}catch{toast('浏览器剪贴板不可用')}break;case 'paste':await paste();break;case 'sample':newQuestion();parseSource(JSON.stringify(example,null,2));toast('已载入一题示例，尚未上传');break;case 'blank':newQuestion();break;case 'add':draft.options.push({key:String.fromCharCode(65+draft.options.length),content:''});autoSave();render();break;case 'back':newQuestion();break;case 'promote':if(role==='admin'&&device==='desktop'){promotion=true;render()}break;case 'cancelPromotion':promotion=false;render();break;case 'confirmPromotion':await promote();break;}})
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{device=b.dataset.device;document.body.classList.toggle('is-mobile',device==='mobile');document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('active',x===b));if(device==='mobile'&&activeTab==='library')activeTab='editor';render()});
$('#next').onclick=newQuestion;$('#upload').onclick=upload;$('#auth').onclick=()=>{logged=!logged;updateChrome();toast(logged?'演示身份：开发者已登录':'演示身份：未登录，本地录题不受影响')};
render();
</script>
</body>
</html>
